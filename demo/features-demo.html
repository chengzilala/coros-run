<!doctype html>
<html lang="zh-CN" data-theme="dark" data-mode="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>功能三图 · 两种排法 Demo</title>
<style>
:root{
  --bg:#08090b; --panel:#101215; --line:#23272d;
  --text:#f4f5f6; --muted:#8b929a; --accent:#ff5a1f;
  --radius:0px; --serif:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --weight:900; --ls:-.01em;
}
html[data-theme="light"]{
  --bg:#f4efe6; --panel:#fbf8f2; --line:#ddd4c4;
  --text:#12233f; --muted:#6d7178; --accent:#e2551a;
  --radius:2px; --serif:"Songti SC","STSong",Georgia,serif;
  --weight:500; --ls:.02em;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}

/* ---------- demo 控制条 ---------- */
.bar{
  position:fixed;left:0;right:0;top:0;z-index:99;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
}
.bar .seg{display:flex;gap:8px;flex-wrap:wrap}
.bar button{
  font:inherit;font-size:12.5px;padding:8px 14px;cursor:pointer;
  color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;
  transition:.18s;
}
.bar button:hover{color:var(--text);border-color:var(--accent)}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar .right{display:flex;gap:8px}

.wrap{padding-top:58px}

/* ---------- 方案 A：横向滑动 ---------- */
.pane{display:none}
html[data-mode="a"] .pane--a{display:block}
html[data-mode="b"] .pane--b{display:block}

.rail-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding:56px 6vw 28px;
}
.kicker{display:block;font-size:10.5px;letter-spacing:.28em;color:var(--muted);margin-bottom:12px}
.rail-head h2{
  margin:0;font-family:var(--serif);font-weight:var(--weight);
  font-size:clamp(26px,3.4vw,44px);line-height:1.15;letter-spacing:var(--ls);
}
.rail-nav{display:flex;gap:10px}
.rail-nav button{
  width:42px;height:42px;border:1px solid var(--line);background:transparent;
  color:var(--muted);border-radius:50%;cursor:pointer;font-size:15px;transition:.18s;
}
.rail-nav button:hover{color:var(--text);border-color:var(--accent)}
.rail{
  display:flex;gap:26px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:0 6vw 26px;cursor:grab;scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.rail.dragging{cursor:grabbing;scroll-snap-type:none}
.rail-card{
  flex:0 0 min(64vw,720px);scroll-snap-align:center;display:block;text-decoration:none;
}
.rail-card .media{
  position:relative;height:clamp(320px,44vh,460px);overflow:hidden;background:var(--panel);
}
.rail-card img{
  width:100%;height:100%;object-fit:cover;
  transform:scale(1.02);transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .4s;
  filter:saturate(.88) contrast(1.02);
}
.rail-card:hover img{transform:scale(1.07);filter:saturate(1)}
.rail-card .tag{
  position:absolute;left:16px;bottom:16px;color:#fff;font-size:10.5px;
  letter-spacing:.18em;padding-left:24px;text-shadow:0 1px 10px rgba(0,0,0,.6);
}
.rail-card .tag::before{
  content:"";position:absolute;left:0;top:50%;width:16px;height:1px;background:currentColor;opacity:.85;
}
.rail-card h3{
  margin:20px 0 8px;font-family:var(--serif);font-weight:var(--weight);
  font-size:clamp(20px,2vw,28px);letter-spacing:var(--ls);transition:color .2s;
}
.rail-card:hover h3{color:var(--accent)}
.rail-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.85;max-width:36em}
.rail-card .more{
  display:inline-block;margin-top:14px;font-size:11.5px;letter-spacing:.08em;
  color:var(--accent);border-bottom:1px solid transparent;padding-bottom:2px;transition:.2s;
}
.rail-card:hover .more{border-bottom-color:var(--accent)}
.rail-progress{margin:0 6vw 72px;height:1px;background:var(--line);position:relative;overflow:hidden}
.rail-progress i{position:absolute;left:0;top:0;bottom:0;width:20%;background:var(--accent);transition:transform .12s linear}

/* ---------- 方案 B：整屏一张大图 ---------- */
.stage{
  position:relative;height:calc(100vh - 58px);min-height:560px;overflow:hidden;
  display:flex;align-items:flex-end;
}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.slide.on{opacity:1}
.slide img{
  width:100%;height:100%;object-fit:cover;transform:scale(1.12);
  transition:transform 7s ease-out;
}
.slide.on img{transform:scale(1)}
.stage-shade{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,8,10,.35) 0%,rgba(6,8,10,.18) 40%,rgba(6,8,10,.86) 100%);
}
.stage-inner{position:relative;z-index:2;width:100%;padding:0 6vw 8vh;color:#fff}
.stage-inner .kick{display:block;font-size:10.5px;letter-spacing:.3em;opacity:.75;margin-bottom:14px}
.stage-inner h2{
  margin:0 0 14px;font-family:var(--serif);font-weight:var(--weight);
  font-size:clamp(34px,6vw,90px);line-height:1.02;letter-spacing:var(--ls);
  max-width:14em;transition:opacity .35s,transform .35s;
}
.stage-inner p{
  margin:0;font-size:14px;line-height:1.9;color:rgba(255,255,255,.78);
  max-width:32em;transition:opacity .35s;
}
.stage-inner .more{
  display:inline-block;margin-top:22px;font-size:12px;letter-spacing:.12em;
  color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:3px;
}
.stage-inner .more:hover{border-bottom-color:#fff}
.stage-inner.swapping h2,.stage-inner.swapping p{opacity:0;transform:translateY(8px)}
.stage-tabs{
  position:relative;z-index:2;display:flex;gap:0;flex-wrap:wrap;
  padding:0 6vw 7vh;margin-top:-2vh;
}
.stage-tabs button{
  flex:1 1 0;min-width:140px;text-align:left;cursor:pointer;
  padding:14px 0 0;margin-right:24px;background:none;border:0;border-top:1px solid rgba(255,255,255,.28);
  color:rgba(255,255,255,.6);font:inherit;font-size:12px;letter-spacing:.06em;
  transition:.2s;position:relative;
}
.stage-tabs button::before{
  content:"";position:absolute;left:0;top:-1px;height:1px;width:0;background:#fff;transition:width .45s ease;
}
.stage-tabs button.on{color:#fff}
.stage-tabs button.on::before{width:100%}
.stage-tabs b{display:block;font-size:10px;letter-spacing:.2em;opacity:.6;margin-bottom:6px;font-weight:400}

/* ---------- 手机 ---------- */
@media (max-width:760px){
  .bar{flex-direction:column;align-items:stretch;gap:8px}
  .bar .right{justify-content:flex-end}
  .wrap{padding-top:104px}
  .rail-card{flex:0 0 82vw}
  .rail-head{padding:34px 20px 22px}
  .rail{padding:0 20px 22px;gap:18px}
  .rail-progress{margin:0 20px 48px}
  .stage{height:calc(100vh - 104px);min-height:520px}
  .stage-inner{padding:0 20px 6vh}
  .stage-inner h2{font-size:clamp(30px,9vw,46px)}
  .stage-tabs{padding:0 20px 5vh}
  .stage-tabs button{min-width:100%;margin:0 0 10px}
}
</style>
</head>
<body>

<div class="bar">
  <div class="seg">
    <button type="button" data-mode="a" class="on">方案 A · 横向滑动</button>
    <button type="button" data-mode="b">方案 B · 整屏大图</button>
  </div>
  <div class="right">
    <button type="button" id="themeBtn">☀️ 切白天</button>
  </div>
</div>

<div class="wrap">

  <!-- ============ 方案 A ============ -->
  <section class="pane pane--a">
    <div class="rail-head">
      <div>
        <span class="kicker">WHAT YOU GET</span>
        <h2>左右拖，一张一张看</h2>
      </div>
      <div class="rail-nav">
        <button type="button" id="prevBtn" aria-label="上一张">←</button>
        <button type="button" id="nextBtn" aria-label="下一张">→</button>
      </div>
    </div>

    <div class="rail" id="rail">
      <a class="rail-card" href="#">
        <div class="media">
          <img src="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=running%20track%20lanes%20seen%20from%20above%20at%20dusk%2C%20geometric%20white%20lines%2C%20dark%20navy%20surface%2C%20minimal%20composition%2C%20cinematic%20film%20grain%2C%20no%20text&image_size=landscape_4_3" alt="训练看板">
          <span class="tag">训练看板</span>
        </div>
        <h3>跑量 · 配速 · 心率</h3>
        <p>一屏看完最近状态，还有训练负荷和强度分布。</p>
        <span class="more">看指标说明 →</span>
      </a>

      <a class="rail-card" href="#">
        <div class="media">
          <img src="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=empty%20asphalt%20road%20curving%20through%20morning%20mist%2C%20soft%20light%2C%20minimal%20cinematic%20photography%2C%20muted%20tones%2C%20no%20text&image_size=landscape_4_3" alt="比赛与 PB">
          <span class="tag">比赛与 PB</span>
        </div>
        <h3>自动认出你的比赛</h3>
        <p>标准距离自动归类 PB，前后半程和撞墙一眼看清。</p>
        <span class="more">看比赛规则 →</span>
      </a>

      <a class="rail-card" href="#">
        <div class="media">
          <img src="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=trail%20runner%20on%20a%20mountain%20ridge%20at%20golden%20hour%2C%20wide%20minimalist%20shot%2C%20film%20grain%2C%20earthy%20muted%20tones%2C%20no%20text&image_size=landscape_4_3" alt="AI 教练">
          <span class="tag">AI 教练</span>
        </div>
        <h3>说人话的中文复盘</h3>
        <p>基于你的真实数据给结论，还能多轮追问。</p>
        <span class="more">看 AI 怎么用 →</span>
      </a>
    </div>
    <div class="rail-progress"><i id="railBar"></i></div>
  </section>

  <!-- ============ 方案 B ============ -->
  <section class="pane pane--b">
    <div class="stage">
      <div class="slide on"><img src="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=running%20track%20lanes%20seen%20from%20above%20at%20dusk%2C%20geometric%20white%20lines%2C%20dark%20navy%20surface%2C%20minimal%20composition%2C%20cinematic%20film%20grain%2C%20no%20text&image_size=landscape_16_9" alt="训练看板"></div>
      <div class="slide"><img src="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=empty%20asphalt%20road%20curving%20through%20morning%20mist%2C%20soft%20light%2C%20minimal%20cinematic%20photography%2C%20muted%20tones%2C%20no%20text&image_size=landscape_16_9" alt="比赛与 PB"></div>
      <div class="slide"><img src="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=trail%20runner%20on%20a%20mountain%20ridge%20at%20golden%20hour%2C%20wide%20minimalist%20shot%2C%20film%20grain%2C%20earthy%20muted%20tones%2C%20no%20text&image_size=landscape_16_9" alt="AI 教练"></div>
      <div class="stage-shade"></div>
      <div class="stage-inner" id="stageInner">
        <span class="kick" id="stageKick">WHAT YOU GET · 01</span>
        <h2 id="stageTitle">跑量 · 配速 · 心率</h2>
        <p id="stageDesc">一屏看完最近状态，还有训练负荷和强度分布。</p>
        <a class="more" href="#">看指标说明 →</a>
      </div>
    </div>
    <div class="stage-tabs" id="stageTabs">
      <button type="button" class="on" data-i="0"><b>01</b>训练看板</button>
      <button type="button" data-i="1"><b>02</b>比赛与 PB</button>
      <button type="button" data-i="2"><b>03</b>AI 教练</button>
    </div>
  </section>

</div>

<script>
/* ---------- 方案切换 ---------- */
document.querySelector('.seg').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-mode]');
  if (!btn) { return; }
  document.documentElement.dataset.mode = btn.dataset.mode;
  [].slice.call(document.querySelectorAll('.seg button')).forEach(function (b) {
    b.classList.toggle('on', b === btn);
  });
  window.scrollTo({ top: 0 });
});

/* ---------- 白天 / 黑夜 ---------- */
var themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', function () {
  var light = document.documentElement.getAttribute('data-theme') === 'light';
  document.documentElement.setAttribute('data-theme', light ? 'dark' : 'light');
  themeBtn.textContent = light ? '☀️ 切白天' : '🌙 切黑夜';
});

/* ---------- 方案 A：拖动 + 箭头 + 进度 ---------- */
var rail = document.getElementById('rail');
var railBar = document.getElementById('railBar');
var down = false, startX = 0, startLeft = 0, moved = 0;

rail.addEventListener('pointerdown', function (e) {
  down = true; moved = 0;
  startX = e.clientX; startLeft = rail.scrollLeft;
  rail.classList.add('dragging');
  rail.setPointerCapture(e.pointerId);
});
rail.addEventListener('pointermove', function (e) {
  if (!down) { return; }
  var dx = e.clientX - startX;
  moved = Math.abs(dx);
  rail.scrollLeft = startLeft - dx;
});
rail.addEventListener('pointerup', function () { down = false; rail.classList.remove('dragging'); });
rail.addEventListener('pointercancel', function () { down = false; rail.classList.remove('dragging'); });
rail.addEventListener('click', function (e) {
  if (moved > 6) { e.preventDefault(); } // 拖动后不触发跳转
});

function step() {
  var card = rail.querySelector('.rail-card');
  return card ? card.getBoundingClientRect().width + 26 : rail.clientWidth * 0.6;
}
document.getElementById('prevBtn').addEventListener('click', function () {
  rail.scrollBy({ left: -step(), behavior: 'smooth' });
});
document.getElementById('nextBtn').addEventListener('click', function () {
  rail.scrollBy({ left: step(), behavior: 'smooth' });
});
function syncRail() {
  var max = rail.scrollWidth - rail.clientWidth;
  var p = max > 0 ? rail.scrollLeft / max : 0;
  railBar.style.transform = 'translateX(' + (p * 400) + '%)';
}
rail.addEventListener('scroll', syncRail, { passive: true });
syncRail();

/* ---------- 方案 B：点标签换图 ---------- */
var SLIDES = [
  { kick: 'WHAT YOU GET · 01', title: '跑量 · 配速 · 心率', desc: '一屏看完最近状态，还有训练负荷和强度分布。' },
  { kick: 'WHAT YOU GET · 02', title: '自动认出你的比赛', desc: '标准距离自动归类 PB，前后半程和撞墙一眼看清。' },
  { kick: 'WHAT YOU GET · 03', title: '说人话的中文复盘', desc: '基于你的真实数据给结论，还能多轮追问。' }
];
var slides = [].slice.call(document.querySelectorAll('.slide'));
var tabs = [].slice.call(document.querySelectorAll('#stageTabs button'));
var inner = document.getElementById('stageInner');
var kickEl = document.getElementById('stageKick');
var titleEl = document.getElementById('stageTitle');
var descEl = document.getElementById('stageDesc');

function go(i) {
  slides.forEach(function (s, k) { s.classList.toggle('on', k === i); });
  tabs.forEach(function (t, k) { t.classList.toggle('on', k === i); });
  inner.classList.add('swapping');
  setTimeout(function () {
    kickEl.textContent = SLIDES[i].kick;
    titleEl.textContent = SLIDES[i].title;
    descEl.textContent = SLIDES[i].desc;
    inner.classList.remove('swapping');
  }, 220);
}
document.getElementById('stageTabs').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-i]');
  if (!btn) { return; }
  go(parseInt(btn.dataset.i, 10));
});
</script>
</body>
</html>
