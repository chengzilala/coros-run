      <stop offset="0" stop-color="#0b0e13"/>
      <stop offset="1" stop-color="#161c26"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#b3)"/>

  <!-- 气泡 -->
  <path d="M250 230 h620 a56 56 0 0 1 56 56 v300 a56 56 0 0 1 -56 56 h-430 l-90 96 v-96 h-100 a56 56 0 0 1 -56 -56 v-300 a56 56 0 0 1 56 -56 z"
