<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>登录 · 跑不快</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="store.js"></script>
<script>window.CorosStore && window.CorosStore.applyTheme();</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-v2.css">
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-main">
      <a class="avatar cfg-back" href="./" title="返回看板">←</a>
      <div>
        <h1>登录 / 注册</h1>
        <div class="sub">邮箱验证码 / 邮箱密码 · 新邮箱自动注册</div>
      </div>
    </div>
    <div class="hero-meta"><a class="pill" href="./">← 返回看板</a></div>
  </header>

  <!-- 登录态 -->
  <section class="card">
    <h3>当前登录状态</h3>
    <div id="state" class="tip">检测中…</div>
    <div class="cfg-actions">
      <button type="button" class="ghost danger-text" id="signOutBtn">退出登录</button>
    </div>
  </section>

  <!-- 登录表单 -->
  <section class="card">
    <h3>登录 / 注册
      <span class="seg" id="loginSeg">
        <button type="button" class="on" data-pane="code">验证码登录</button>
        <button type="button" data-pane="pwd">密码登录</button>
      </span>
    </h3>

    <!-- 验证码登录 -->
    <div id="paneCode">
      <div class="field">
        <label for="email">邮箱</label>
        <div class="key-row">
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" spellcheck="false">
          <button type="button" class="primary" id="sendBtn">发送验证码</button>
        </div>
        <div class="tip" id="sendTip">点「发送验证码」，6 位数字会发到你的邮箱（若收不到请查垃圾箱）。</div>
      </div>

      <div class="field">
        <label for="code">验证码（6 位数字）</label>
        <div class="key-row">
          <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
          <button type="button" class="primary" id="loginBtn">登录 / 注册</button>
        </div>
      </div>
    </div>

    <!-- 密码登录 -->
    <div id="panePwd" hidden>
      <div class="field">
        <label for="pwdEmail">邮箱 / 用户名</label>
        <input id="pwdEmail" type="text" placeholder="you@example.com 或 用户名" autocomplete="username" spellcheck="false">
      </div>
      <div class="field">
        <label for="pwd">密码</label>
        <input id="pwd" type="password" placeholder="你的密码" autocomplete="current-password">
      </div>
      <div class="cfg-actions">
        <button type="button" class="primary" id="pwdLoginBtn">登录</button>
      </div>
      <div class="tip">首次使用或忘记密码？<a href="#" id="toSetPwd">设置 / 重置密码</a>（用邮箱验证码验证身份）。</div>
    </div>

    <div id="msg" class="msg"></div>
  </section>

  <!-- 设置密码 -->
  <section class="card" id="setPwdCard" hidden>
    <h3>设置用户名 / 密码 <span class="hint">用邮箱验证码验证身份，之后可免验证码登录</span></h3>

    <div class="field">
      <label for="spEmail">邮箱</label>
      <div class="key-row">
        <input id="spEmail" type="email" placeholder="you@example.com" autocomplete="email" spellcheck="false">
        <button type="button" class="primary" id="spSendBtn">发送验证码</button>
      </div>
    </div>

    <div class="field">
      <label for="spCode">验证码（6 位数字）</label>
      <input id="spCode" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
    </div>

    <div class="field">
      <label for="spPwd">新密码</label>
      <input id="spPwd" type="password" placeholder="8-32 位，需同时包含字母和数字" autocomplete="new-password">
    </div>

    <div class="field">
      <label for="spUser">用户名（可选）</label>
      <input id="spUser" type="text" placeholder="如 cheng_run（4-24 位字母/数字/_-）" autocomplete="username" spellcheck="false">
      <div class="tip">设了用户名后，登录时「账号」可填邮箱、也可填用户名。留空则用系统默认。</div>
    </div>

    <div class="cfg-actions">
      <button type="button" class="primary" id="spBtn">保存并登录</button>
      <button type="button" class="ghost" id="spCancelBtn">取消</button>
    </div>
    <div id="spMsg" class="msg"></div>
  </section>

  <footer>你的邮箱与训练数据只存在你自己的云环境 · <a href="privacy.html">隐私政策</a> · © 2026 <a href="https://chesterlee.cn/" target="_blank" rel="noopener">Chester</a> · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">陇ICP备2026009894号-2</a> · <a href="https://beian.mps.gov.cn/#/query/webSearch?code=62052302000062" target="_blank" rel="noopener"><img src="/assets/img/beian-police.png" alt="公安备案" width="16" height="16" style="vertical-align:-3px;margin-right:4px;border:0">甘公网安备62052302000062号</a></footer>
</div>

<script src="lib/cloudbase.full.js"></script>
<script src="ui.js"></script>
<script src="auth.js"></script>
<script src="login.js"></script>
<script src="i18n/zh-hant-data.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n.js"></script>
</body>
</html>
