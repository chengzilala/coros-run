<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI 跑步教练 · 跑不快</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="store.js"></script>
<script>window.CorosStore && window.CorosStore.applyTheme();</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-v2.css">
</head>
<body>
<div class="wrap">

  <header class="hero coach-hero">
    <div class="hero-main">
      <div class="avatar" id="coachAvatar">练</div>
      <div>
        <h1>专属跑步教练</h1>
        <div class="sub" id="coachSub">丹尼尔斯跑步公式 · 基于你的真实训练数据</div>
      </div>
    </div>
    <div class="hero-side">
      <a class="hero-btn" href="./" title="返回看板">← 看板</a>
      <button type="button" class="hero-btn" id="clearBtn" title="清空当前对话">清空</button>
      <button type="button" class="hero-btn" id="themeToggle" title="切换白天 / 黑夜"></button>
    </div>
  </header>

  <details class="card coach-tool" id="fuelTool">
    <summary>补给计算器 <span class="coach-tool-hint">按体重 / 时长 / 强度算出补给数字（确定性计算，不经 AI）</span></summary>
    <div class="fuel-grid">
      <label>体重 kg<input type="number" id="fuelWeight" min="30" max="150" step="0.1" placeholder="60"></label>
      <label>时长 分钟<input type="number" id="fuelMin" min="10" max="600" step="5" placeholder="90"></label>
      <label>强度
        <select id="fuelLevel">
          <option value="easy">轻松 / 慢跑（E）</option>
          <option value="moderate" selected>中等 / 节奏（M·T）</option>
          <option value="hard">高强度 / 比赛（I·R）</option>
        </select>
      </label>
      <button type="button" class="hero-btn" id="fuelGo">计算</button>
    </div>
    <div class="fuel-out" id="fuelOut" aria-live="polite"></div>
    <div class="chart-foot">数字为一般性训练参考，仅供参考，非医疗建议。</div>
  </details>

  <section class="card coach-card">
    <h3>教练风格
      <span class="seg" id="personaSeg" role="group" aria-label="教练风格"></span>
    </h3>
    <div class="persona-desc" id="personaDesc" aria-live="polite"></div>
    <div id="chatLog" class="chat-log" aria-live="polite"></div>
    <div class="chat-suggest">
      <div class="chat-suggest__label">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 17.4h5.6M9.8 20.2h4.4"/><path d="M12 3.6a5.6 5.6 0 0 1 3.4 10.1c-.6.5-.9 1-.9 1.7h-5c0-.7-.3-1.2-.9-1.7A5.6 5.6 0 0 1 12 3.6z"/></svg>
        试试这样问（按你的数据生成）
      </div>
      <div id="chatChips" class="chat-chips"></div>
    </div>
    <form id="chatForm" class="chat-form" autocomplete="off">
      <div class="chat-composer">
        <textarea id="chatInput" rows="1" placeholder="输入你的问题，回车发送…"></textarea>
        <button type="submit" id="chatSend">发送</button>
      </div>
    </form>
    <div class="chart-foot">教练建议按丹尼尔斯训练原则给出，仅供参考；伤病 / 身体不适请及时就医。数据只读，不会写入你的手表。</div>
  </section>

  <footer>© 2026 <a href="https://chesterlee.cn/" target="_blank" rel="noopener">Chester</a> · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">陇ICP备2026009894号-2</a> · <a href="https://beian.mps.gov.cn/#/query/webSearch?code=62052302000062" target="_blank" rel="noopener"><img src="/assets/img/beian-police.png" alt="公安备案" width="16" height="16" style="vertical-align:-3px;margin-right:4px;border:0">甘公网安备62052302000062号</a></footer>
</div>

<script src="ui.js"></script>
<script src="nutrition.js"></script>
<script src="lib/cloudbase.full.js"></script>
<script src="auth.js"></script>
<script src="coach.js"></script>
<script src="i18n/zh-hant-data.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n.js"></script>
</body>
</html>
